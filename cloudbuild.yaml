# Build and deploy SocioChat backend to Cloud Run
# Usage: gcloud builds submit --config cloudbuild.yaml --project YOUR_PROJECT_ID
#
# Set substitution variables (optional):
#   _SERVICE_NAME=sociochat-backend-v2
#   _REGION=europe-west1

substitutions:
  _SERVICE_NAME: sociochat-backend-v2
  _REGION: europe-west1

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/sociochat-backend:$BUILD_ID
      - -t
      - gcr.io/$PROJECT_ID/sociochat-backend:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/sociochat-backend:$BUILD_ID

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/sociochat-backend:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=gcr.io/$PROJECT_ID/sociochat-backend:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --timeout=300
      - --min-instances=0
      - --max-instances=10
      - --set-env-vars=FLASK_ENV=production

images:
  - gcr.io/$PROJECT_ID/sociochat-backend:$BUILD_ID
  - gcr.io/$PROJECT_ID/sociochat-backend:latest

options:
  logging: CLOUD_LOGGING_ONLY
